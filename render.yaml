# Render.com blueprint (free web service). Provide DATABASE_URL pointing at a
# MySQL database (e.g. Railway free MySQL) in the Render dashboard.
services:
  - type: web
    name: istock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask init-db && gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
