# Development overrides. Docker Compose merges this file automatically on
# `docker compose up`, so code changes show up without rebuilding:
#   * the project folder is bind-mounted into the container (/app)
#   * Flask's dev server runs in debug mode: saving a .py file restarts it,
#     saving a template/CSS/JS file reloads the open browser tab
#
# Rebuild only when requirements.txt or the Dockerfile changes:
#   docker compose up --build
# Production-like run (gunicorn, no mount) without this file:
#   docker compose -f docker-compose.yml up --build
services:
  web:
    command: sh -c "flask init-db && flask run --host 0.0.0.0 --port 8000 --debug"
    environment:
      FLASK_APP: wsgi.py
      FLASK_DEBUG: "1"
    volumes:
      - .:/app
      - /app/.venv   # keep the host's macOS virtualenv out of the container
