# Local production-like stack: MySQL 8 + i-STOCK
#   docker compose up --build
#   docker compose exec web flask seed     (optional demo data)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: istock
      MYSQL_USER: istock
      MYSQL_PASSWORD: istock_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://istock:istock_pass@db:3306/istock?charset=utf8mb4
      SECRET_KEY: change-me-in-production
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  mysql_data:
